<!--
================================================================================
HEADER GOAL NET  (mockup only; the app header texture today = plain pitch grid)
================================================================================
Open:  header-net.html?v=a|b|c|d   (g = the CURRENT pitch grid, reference)
       &glow         animate the loading glow (HERO_GLOW pulse, 3.4 s)
       &glow=peak    freeze the glow at full intensity (screenshots)
       &bare=1       one 1200 px header, no review bar (&img=welcome|club|squad|reports)
       &k=1.0        texture strength multiplier (slider in the review bar)  &peak=0.10  glow peak alpha
       &w=1920       header width (default 1200)
Header geometry = the app's (HANDOVER hero): 186 px tall = 38 px nav row + 148 px content, page image cover/center 40 %
at 38 % opacity, base gradient 135deg #0d1f35/#0f2a1a/#1a1208, overlay 180deg rgba(8,12,18) .30/.55/.90, texture ABOVE the
overlay and below the text, 56 px badge cell, 28 px title, 11 px subtitle.

-------------------------------------------------------------------------------
HOW THE APP PORTS THIS (QPainter, no images)
-------------------------------------------------------------------------------
Every net is built by ONE function, net_geometry(variant, w, h), returning
    strands : list of straight segments (x0,y0,x1,y1) or quadratic beziers (x0,y0,cx,cy,x1,y1)
    knots   : list of (x,y) junction points
    mask    : None | a QGradient used as a DestinationIn alpha mask (light falloff / vignette)
    deco    : None | extra opaque-ish shapes (variant D post + crossbar)
Cache ONE QPixmap per (w, h, dpr) in the same cache slot as _g_cache, like _glow_layers does today:
    net_px = QPixmap(round(w*dpr), round(h*dpr)); net_px.setDevicePixelRatio(dpr); net_px.fill(transparent)
    q = QPainter(net_px); q.setRenderHint(Antialiasing)
    path = QPainterPath()
    for s in strands: path.moveTo(s[0],s[1]); (path.lineTo(x1,y1) if len(s)==4 else path.quadTo(cx,cy,x1,y1))
    q.setPen(QPen(QColor(255,255,255,round(255*A_LINE)), W_LINE, SolidLine, RoundCap, RoundJoin)); q.drawPath(path)
        (ONE drawPath => overlaps are a union, no double alpha at crossings; same in the canvas preview)
    q.setPen(NoPen); q.setBrush(QColor(255,255,255,round(255*A_KNOT)))
    for k in knots: q.drawEllipse(QPointF(*k), R_KNOT, R_KNOT)
    if mask: q.setCompositionMode(DestinationIn); q.fillRect(rect, QBrush(mask)); (mask gradient stops = alpha)
    q.end()
paintEvent step 4 becomes ONE call:  p.drawPixmap(0, 0, net_px)   (instead of ~110 drawLine calls)
LOADING GLOW REUSES THE SAME MASK: build core_px / halo_px by calling the same generator but stroking the same `path`
in the tint QColor(150,130,255,...) (core: W_LINE+0.6, halo: widths HALO), then re-apply `mask` (DestinationIn). Paint them
exactly as now (CompositionMode_Plus, setOpacity(peak_alpha*v) and peak_alpha*v*halo_gain). HERO_GLOW needs NO new keys
except halo_widths becoming per-net (see numbers below); peak 0.10 / period 3400 / floor .35 / depth .65 unchanged.
Knots are drawn in the glow core pass too (same ellipses, tint, alpha 1.0).
-------------------------------------------------------------------------------
GENERATORS (pseudocode, numbers are the shipped constants in P below)
-------------------------------------------------------------------------------
A  DIAMOND MESH (classic netting)         a = 40 deg, s = tan(a), ph = 20
   family 1:  y =  s*x + i*ph     family 2:  y = -s*x + j*ph     i, j integer, lines clipped to [0,w]x[0,h]
   knots at  x = (j-i)*ph/(2*s),  y = (i+j)*ph/2   (inside the rect)
   stroke 1.2 px, alpha .042; knot r 1.3 px, alpha .026 (crossing total ~ .067).   NO mask.
B  SQUARE-KNOT NET (sagging orthogonal mesh)   cell c = 16, warp F(x,y):
   F(x,y) = ( x + AX*sin(2*pi*y/LY),  y + AY*sin(2*pi*x/LX + 0.8)*(0.4 + 0.6*y/h) )
   AX 2.4, LY 300, AY 3.2, LX 360.  Strands: for each row y=k*c: chunk x into CH=5 cells (80 px); each chunk is a quad
   bezier  P0=F(xa,y)  P1=F(xb,y)  ctrl = 2*F(xm,y) - (P0+P1)/2   (passes exactly through the warped midpoint).
   same for each column x=k*c (chunks in y).  Knots at F(i*c, j*c).  stroke 1.1, alpha .042; knot r 1.2 alpha .026.  NO mask.
C  PERSPECTIVE NET (hanging in the goal mouth)  lattice coords (u in 0..N, v integer rows):
   t = u/N;  x(t) = w*(t - K*t*t)/(1 - K)         K .35 : column spacing shrinks 1.54x -> 0.46x of average toward the right
   y(x,y0) = vy + (y0 - vy)*(1 - PERSP*x/w) + BOW*4*(x/w)*(1-x/w)*((y0-vy)/h) + RIP*sin(2*pi*x/260 + y0/55)     vy = .42*h, PERSP .60, BOW 7, RIP 2.2
   N = 44 columns, rows y0 = v*30 + 7, spaced 30 px at left -> 12 px at right; chunks CH 3 cells (columns: 2 rows). Knots at lattice crossings.
   stroke 1.1, alpha .048; knot r 1.1 alpha .026.  MASK = radial alpha (focus .78w,.45h, radius .95w): 1.0 / .70 @ .6 / .30 @ 1.
   plus a soft shadow: radial rgba(0,0,0,.30) at the corners (separate QRadialGradient fill under the net).
D  HEX NET + LIGHT SWEEP + POST CORNER (own idea)   honeycomb, side s = 12, hex width W6 = sqrt(3)*s = 20.8, row step 1.5*s
   row r: base b = r*1.5*s;  zigzag vertices  x_i = i*W6/2, y_i = b + (((i+r) mod 2)==0 ? 0 : s/2)   (consecutive vertices
   joined);  vertical edges from every vertex with (i+r) odd:  (x_i, b + s/2) -> (x_i, b + 1.5*s).  Knots at all vertices.
   stroke 1.1, alpha .060 (peak; the mask scales it); knot r 1.2 alpha .026.
   MASK = linear light sweep through (.68w,.5h) along dir 30 deg, half-length 380: alpha .30 / 1.0 / .30 at 0 / .5 / 1.
   DECO (drawn after the net, not masked): goal post at x = w-14..w-8 full height: vertical body white .06, 1 px
   left highlight white .14, soft shadow strip to its left (black .22 -> 0 over 16 px); crossbar y = 0..5 from the post
   leftwards 300 px: white .11 -> 0 along x, bottom highlight 1 px white .18 -> 0, shadow strip 10 px under it (black .25 -> 0).
GLOW: halo widths (8,4) px (net cells are 16-24 px, so the app's 14/7 would fog the mesh), alpha .35*(i+1)/2, core width = stroke+0.6
(+ knots r+0.4), tint 150,130,255, peak .10, halo gain .40.
Legibility: net alpha never exceeds ~.08 white; the readout in the review bar measures worst-pixel contrast of the title
and subtitle over the real composite, with and without the net.
-->
<style>
:root{
  --bg:#080c12; --surface:#111720; --border:#263140; --text:#e8edf2; --text-dim:#7a8fa6; --accent:#3d8bcd; --purple:#8b5cf6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
body.bare{background:#000}
.bar{position:sticky;top:0;z-index:50;background:#0c121b;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar h1{font-size:13px;font-weight:600;letter-spacing:.04em;margin-right:6px}
.bar a,.bar button{font:inherit;color:var(--text-dim);background:#141c27;border:1px solid var(--border);border-radius:4px;padding:5px 10px;text-decoration:none;cursor:pointer}
.bar a:hover,.bar button:hover{color:var(--text);border-color:#35465c}
.bar a.on,.bar button.on{color:#fff;border-color:var(--accent);background:#17283b}
.bar .sep{width:1px;height:20px;background:var(--border)}
.bar label{color:var(--text-dim);display:flex;align-items:center;gap:6px}
.bar input[type=range]{width:110px}
.stat{color:var(--text-dim);font-size:12px;font-variant-numeric:tabular-nums}
.stat b{color:var(--text);font-weight:600}
.page{padding:18px 16px 40px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
body.bare .page{padding:0;gap:0}
.cap{color:var(--text-dim);font-size:12px;margin:0 0 6px;letter-spacing:.04em}
.cap b{color:var(--text);font-weight:600}
.sec-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-top:6px}
.note{color:var(--text-dim);font-size:12px;max-width:1200px;line-height:1.5}

/* ---------- the header (geometry from the app / .a-hero in club-page-design-a.html, 186 px tall) ---------- */
.hero{position:relative;height:186px;overflow:hidden;flex:none;background:linear-gradient(135deg,#0d1f35 0%,#0f2a1a 50%,#1a1208 100%);border-bottom:1px solid rgba(255,255,255,.06)}
.hero .bg{position:absolute;inset:0;opacity:.38;background-size:cover;background-position:center 40%}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,18,.30) 0%,rgba(8,12,18,.55) 55%,rgba(8,12,18,.90) 100%)}
.hero canvas{position:absolute;left:0;top:0;pointer-events:none}
.hero .glow{mix-blend-mode:plus-lighter;opacity:0}
.hero .shade{position:absolute;inset:0;pointer-events:none}
.hero .nav{position:absolute;left:0;right:0;top:0;height:38px;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:0 16px}
.hero .nav span{height:26px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:500;color:#cfd8e3;background:rgba(14,22,34,.8);border:1px solid rgba(255,255,255,.22);border-radius:4px}
.hero .inner{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:flex-end;gap:12px}
.hero .badge{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center}
.hero .badge img{width:56px;height:56px;display:block}
.hero h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:28px;font-weight:700;letter-spacing:.04em;line-height:1.1;color:#e8edf3;text-shadow:0 2px 16px rgba(0,0,0,.9);white-space:nowrap}
.hero .sub{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.hero .tx{flex:1;min-width:0}
.hero .right{flex:none;text-align:right;font-size:12px;color:rgba(255,255,255,.75);padding-bottom:2px}
.hero .right b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;color:#e8edf3;letter-spacing:.04em}
</style>
</head>

<div class="bar" id="bar"></div>
<div class="page" id="page"></div>

function clipSeg(x0,y0,x1,y1,w,h){            // Liang-Barsky: keep only the part inside [0,w]x[0,h]
  let t0=0,t1=1; const dx=x1-x0, dy=y1-y0;
  const pq=[[-dx,x0],[dx,w-x0],[-dy,y0],[dy,h-y0]];
  for(const [p,q] of pq){
    if(p===0){ if(q<0) return null; }
    else { const r=q/p; if(p<0){ if(r>t1) return null; if(r>t0) t0=r; } else { if(r<t0) return null; if(r<t1) t1=r; } }
  }
  return [x0+t0*dx,y0+t0*dy,x0+t1*dx,y0+t1*dy];
}
const inRect=(x,y,w,h,m=0)=>x>=-m&&x<=w+m&&y>=-m&&y<=h+m;
// quad bezier chunk through F at the chunk midpoint: ctrl = 2*F(mid) - (P0+P1)/2
function quadThrough(F,a0,a1){ const p0=F(a0),p1=F(a1),pm=F((a0+a1)/2); return [p0[0],p0[1],2*pm[0]-(p0[0]+p1[0])/2,2*pm[1]-(p0[1]+p1[1])/2,p1[0],p1[1]]; }

function netGeometry(v,w,h){
  const p=P[v], segs=[], knots=[];
  if(v==='g'){                                   // current grid: vertical every 40 from x=38, horizontal every 60 from y=58
    for(let x=38;x<w;x+=40) segs.push([x,0,x,h]);
    for(let y=58;y<h;y+=60) segs.push([0,y,w,y]);
    return {segs,knots,mask:null,deco:null};
  }
  if(v==='a'){
    const s=Math.tan(p.angle*Math.PI/180), ph=p.ph;
    const lo=Math.floor((-s*w-ph)/ph), hi=Math.ceil((h+s*w)/ph);
    for(let i=lo;i<=hi;i++){
      let c=clipSeg(0,i*ph,w,i*ph+s*w,w,h); if(c) segs.push(c);          // y =  s*x + i*ph
      c=clipSeg(0,i*ph,w,i*ph-s*w,w,h);     if(c) segs.push(c);          // y = -s*x + i*ph
    }
    for(let i=lo;i<=hi;i++) for(let j=lo;j<=hi;j++){
      const x=(j-i)*ph/(2*s), y=(i+j)*ph/2; if(inRect(x,y,w,h)) knots.push([x,y]);
    }
    return {segs,knots,mask:null,deco:null};
  }
  if(v==='b'){
    const c=p.cell, TAU=2*Math.PI;
    const Fw=(x,y)=>[x+p.ax*Math.sin(TAU*y/p.ly), y+p.ay*Math.sin(TAU*x/p.lx+0.8)*(0.4+0.6*y/h)];
    const x0=-2*c, x1=w+2*c, y0=-2*c, y1=h+2*c, st=p.chunk*c;
    for(let y=y0;y<=y1;y+=c) for(let xa=x0;xa<x1;xa+=st) segs.push(quadThrough(x=>Fw(x,y),xa,Math.min(xa+st,x1)));
    for(let x=x0;x<=x1;x+=c) for(let ya=y0;ya<y1;ya+=st) segs.push(quadThrough(yy=>Fw(x,yy),ya,Math.min(ya+st,y1)));
    for(let x=x0;x<=x1;x+=c) for(let y=y0;y<=y1;y+=c){ const q=Fw(x,y); if(inRect(q[0],q[1],w,h)) knots.push(q); }
    return {segs:segs.filter(s=>segTouches(s,w,h)),knots,mask:null,deco:null};
  }
  if(v==='c'){
    const vy=p.vpY*h, N=p.cols;
    const X=u=>{ const t=u/N; return w*(t-p.k*t*t)/(1-p.k); };
    const Fc=(u,y0)=>{ const x=X(u), f=x/w; return [x, vy+(y0-vy)*(1-p.persp*f)+p.bow*4*f*(1-f)*((y0-vy)/h)+p.rip*Math.sin(2*Math.PI*x/260+y0/55)]; };
    const rows=[]; for(let y0=-240;y0<=h+240;y0+=p.rowPitch) rows.push(y0+7);
    const st=p.chunk;
    for(const y0 of rows) for(let ua=-4;ua<N+4;ua+=st) segs.push(quadThrough(u=>Fc(u,y0),ua,Math.min(ua+st,N+4)));
    for(let u=-4;u<=N+4;u++) for(let ra=0;ra<rows.length-1;ra+=2){
      const ya=rows[ra], yb=rows[Math.min(ra+2,rows.length-1)];
      segs.push(quadThrough(yy=>Fc(u,yy),ya,yb));
    }
    for(let u=-4;u<=N+4;u++) for(const y0 of rows){ const q=Fc(u,y0); if(inRect(q[0],q[1],w,h)) knots.push(q); }
    const vg=p.vig;
    const mask=(ctx)=>{ const g=ctx.createRadialGradient(vg.fx*w,vg.fy*h,0,vg.fx*w,vg.fy*h,vg.r*w);
      for(const [o,a] of vg.stops) g.addColorStop(o,`rgba(0,0,0,${a})`); ctx.globalCompositeOperation='destination-in'; ctx.fillStyle=g; ctx.fillRect(0,0,w,h); ctx.globalCompositeOperation='source-over'; };
    const shade=(ctx)=>{ const g=ctx.createRadialGradient(w*0.55,h*0.5,Math.min(w,h)*0.25,w*0.55,h*0.5,w*0.62);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${p.shadow})`); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); };
    return {segs:segs.filter(s=>segTouches(s,w,h)),knots,mask,deco:null,shade};
  }
  if(v==='d'){
    const s=p.s, W6=Math.sqrt(3)*s, hx=W6/2;
    const rmin=-1, rmax=Math.ceil(h/(1.5*s))+1, imax=Math.ceil(w/hx)+1;
    for(let r=rmin;r<=rmax;r++){
      const b=r*1.5*s; let prev=null;
      for(let i=-1;i<=imax;i++){
        const x=i*hx, odd=(((i+r)%2)+2)%2===1, y=b+(odd?s/2:0);
        if(prev) segs.push([prev[0],prev[1],x,y]);
        if(odd) segs.push([x,y,x,b+1.5*s]);
        if(inRect(x,y,w,h)) knots.push([x,y]);
        prev=[x,y];
      }
    }
    const L=p.light, th=L.deg*Math.PI/180, dx=Math.cos(th), dy=Math.sin(th), cx=L.cx*w, cy=L.cy*h;
    const mask=(ctx)=>{ const g=ctx.createLinearGradient(cx-dx*L.half,cy-dy*L.half,cx+dx*L.half,cy+dy*L.half);
      for(const [o,a] of L.stops) g.addColorStop(o,`rgba(0,0,0,${a})`); ctx.globalCompositeOperation='destination-in'; ctx.fillStyle=g; ctx.fillRect(0,0,w,h); ctx.globalCompositeOperation='source-over'; };
    const o=p.post;
    const deco=(ctx)=>{
      const px=w-o.x-o.wPost;
      let g=ctx.createLinearGradient(px-o.shadowW,0,px,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${o.shadowA})`);
      ctx.fillStyle=g; ctx.fillRect(px-o.shadowW,0,o.shadowW,h);                       // shadow the post throws on the net
      g=ctx.createLinearGradient(w-o.barLen-o.x,0,w-o.x,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.25)');
      ctx.fillStyle=g; ctx.fillRect(w-o.barLen-o.x,o.barH,o.barLen,10);                // shadow under the crossbar
      ctx.fillStyle=`rgba(255,255,255,${o.bodyA})`; ctx.fillRect(px,0,o.wPost,h);      // post body
      ctx.fillStyle=`rgba(255,255,255,${o.edgeA})`; ctx.fillRect(px,0,1,h);            // post highlight edge
      g=ctx.createLinearGradient(w-o.barLen-o.x,0,w-o.x,0); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${o.barA})`);
      ctx.fillStyle=g; ctx.fillRect(w-o.barLen-o.x,0,o.barLen,o.barH);                 // crossbar body (fades out to the left)
      g=ctx.createLinearGradient(w-o.barLen-o.x,0,w-o.x,0); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,`rgba(255,255,255,${o.barEdgeA})`);
      ctx.fillStyle=g; ctx.fillRect(w-o.barLen-o.x,o.barH-1,o.barLen,1);               // crossbar bottom highlight
    };
    return {segs,knots,mask,deco};
  }
}
function segTouches(s,w,h){ const xs=s.filter((_,i)=>i%2===0), ys=s.filter((_,i)=>i%2===1);
  return Math.max(...xs)>=-4&&Math.min(...xs)<=w+4&&Math.max(...ys)>=-4&&Math.min(...ys)<=h+4; }

/* ===================== canvas painters (the QPainter port draws exactly these) ===================== */
function layer(cv,w,h,dpr){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); return ctx; }
function strokePath(ctx,segs){ ctx.beginPath(); for(const s of segs){ ctx.moveTo(s[0],s[1]); if(s.length===4) ctx.lineTo(s[2],s[3]); else ctx.quadraticCurveTo(s[2],s[3],s[4],s[5]); } }
function knotsPath(ctx,knots,r){ ctx.beginPath(); for(const k of knots){ ctx.moveTo(k[0]+r,k[1]); ctx.arc(k[0],k[1],r,0,Math.PI*2); } }

function drawNet(cv,g,v,w,h,dpr,k){
  const p=P[v], ctx=layer(cv,w,h,dpr);
  if(g.shade) g.shade(ctx);                                        // C: soft corner shadow (under the net)
  const sub=document.createElement('canvas'); const sc=layer(sub,w,h,dpr);   // net + mask on its own, then composited
  ctx.save();
  strokePath(sc,g.segs); sc.lineWidth=p.w; sc.lineCap='round'; sc.lineJoin='round'; sc.strokeStyle=`rgba(255,255,255,${Math.min(1,p.a*k)})`; sc.stroke();
  if(g.knots.length){ knotsPath(sc,g.knots,p.knotR); sc.fillStyle=`rgba(255,255,255,${Math.min(1,p.knotA*k)})`; sc.fill(); }
  if(g.mask) g.mask(sc);
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(sub,0,0); ctx.restore(); ctx.setTransform(dpr,0,0,dpr,0,0);
  if(g.deco) g.deco(ctx);
}
function drawGlow(cv,g,v,w,h,dpr,widths,alphaOf,coreExtra){
  const p=P[v], ctx=layer(cv,w,h,dpr), sub=document.createElement('canvas'), sc=layer(sub,w,h,dpr);
  const [r,gg,b]=GLOW.tint;
  strokePath(sc,g.segs); sc.lineCap='round'; sc.lineJoin='round';
  widths.forEach((wd,i)=>{ sc.lineWidth=wd; sc.strokeStyle=`rgba(${r},${gg},${b},${alphaOf(i)})`; sc.stroke(); });
  if(coreExtra && g.knots.length){ knotsPath(sc,g.knots,p.knotR+0.4); sc.fillStyle=`rgba(${r},${gg},${b},1)`; sc.fill(); }
  if(g.mask) g.mask(sc);
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(sub,0,0);
}

/* ===================== header component ===================== */
const heroes=[];
function makeHero(v,imgKey,w,opts={}){
  const g=netGeometry(v,w,H), p=P[v], dpr=window.devicePixelRatio||1;
  const el=document.createElement('div'); el.className='hero'; el.style.width=w+'px';
  const s=SAMPLE[imgKey];
  el.innerHTML=`<div class="bg" style="background-image:url('${IMG[imgKey]}')"></div><div class="ov"></div>
    <canvas class="net"></canvas><canvas class="glow halo"></canvas><canvas class="glow core"></canvas>
    <div class="nav"><span>Save Changes</span><span>Load Save</span><span>Reload</span><span>&#9881;</span></div>
    <div class="inner"><div class="badge"><img alt="" src="${ICON[imgKey]}"></div>
      <div class="tx"><h2>${s.t}</h2><div class="sub">${s.s}</div></div>
      ${s.right?`<div class="right"><b>${s.right[0]}</b>${s.right[1]}</div>`:''}</div>`;
  const hero={el,v,w,g,imgKey,dpr};
  heroes.push(hero); hero.paint=()=>paintHero(hero);
  hero.paint(); return hero;
}
function paintHero(hero){
  const {el,v,w,g,dpr}=hero, p=P[v];
  drawNet(el.querySelector('.net'),g,v,w,H,dpr,K);
  if(v==='g') return;
  const n=p.halo.length;
  drawGlow(el.querySelector('.halo'),g,v,w,H,dpr,p.halo,i=>0.35*(i+1)/n,false);
  drawGlow(el.querySelector('.core'),g,v,w,H,dpr,[p.w+0.6],()=>1,true);
}
function glowIntensity(t){
  if(GLOWMODE==='peak') return 1;
  const pulse=0.5-0.5*Math.cos(2*Math.PI*t/GLOW.period), x=Math.min(1,t/GLOW.fadeIn), sm=x*x*(3-2*x);
  return (GLOW.floor+GLOW.depth*pulse)*sm;
}
function applyGlow(t){
  const gi=glowIntensity(t);
  for(const h of heroes){ if(h.v==='g') continue;
    h.el.querySelector('.core').style.opacity=PEAK*gi;
    h.el.querySelector('.halo').style.opacity=PEAK*gi*GLOW.haloGain; }
  const rd=document.getElementById('glowval'); if(rd) rd.textContent=gi.toFixed(2);
}
function startGlow(){
  if(GLOWMODE==='off') return;
  const t0=performance.now(); (function tick(){ applyGlow(performance.now()-t0); if(GLOWMODE==='anim') requestAnimationFrame(tick); })();
}

/* ===================== contrast readout: real composite under the title / subtitle, with and without the net ===================== */
function lum(r,g,b){ const f=c=>{c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}; return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); }
function cr(l1,l2){ if(l1<l2)[l1,l2]=[l2,l1]; return (l1+0.05)/(l2+0.05); }
async function contrast(hero){
  const {el,w,imgKey}=hero, dpr=1;
  const c=document.createElement('canvas'); c.width=w; c.height=H; const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,w*0.6,H*1.0); // approx CSS 135deg
  g.addColorStop(0,'#0d1f35'); g.addColorStop(.5,'#0f2a1a'); g.addColorStop(1,'#1a1208'); x.fillStyle=g; x.fillRect(0,0,w,H);
  const im=new Image(); im.src=IMG[imgKey]; await im.decode();
  const sc=Math.max(w/im.width,H/im.height), dw=im.width*sc, dh=im.height*sc;
  x.globalAlpha=.38; x.drawImage(im,(w-dw)/2,(H-dh)*0.4,dw,dh); x.globalAlpha=1;
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(8,12,18,.30)'); g.addColorStop(.55,'rgba(8,12,18,.55)'); g.addColorStop(1,'rgba(8,12,18,.90)'); x.fillStyle=g; x.fillRect(0,0,w,H);
  const rt=el.querySelector('h2').getBoundingClientRect(), rs=el.querySelector('.sub').getBoundingClientRect(), re=el.getBoundingClientRect();
  const box=r=>[Math.max(0,Math.floor(r.left-re.left)),Math.max(0,Math.floor(r.top-re.top)),Math.ceil(r.width),Math.ceil(r.height)];
  const worst=(b,col,withNet)=>{ const d=x.getImageData(...b).data; const arr=[]; for(let i=0;i<d.length;i+=4) arr.push(lum(d[i],d[i+1],d[i+2]));
    arr.sort((a,b2)=>a-b2); const p99=arr[Math.floor(arr.length*0.99)]; return cr(lum(...col),p99); };
  const tc=[232,237,243], sc2=[168,171,174];
  const before=[worst(box(rt),tc),worst(box(rs),sc2)];
  const net=el.querySelector('.net'); x.drawImage(net,0,0,w,H);
  const after=[worst(box(rt),tc),worst(box(rs),sc2)];
  return {before,after};
}

/* ===================== page ===================== */
const bar=document.getElementById('bar'), page=document.getElementById('page');
if(BARE){ document.body.classList.add('bare'); bar.style.display='none';
  const ik=(Q.get('img')||'welcome'); makeHero(VAR,IMG[ik]?ik:'welcome',W); page.appendChild(heroes[0].el); }
else {
  const link=(label,params,on)=>{ const u=new URLSearchParams(location.search); for(const [k,v] of Object.entries(params)){ if(v===null) u.delete(k); else u.set(k,v);} return `<a class="${on?'on':''}" href="?${u}">${label}</a>`; };
  const nv=Object.keys(P).filter(k=>k!=='g');
  bar.innerHTML=`<h1>Header goal net</h1>`+nv.map(k=>link(k.toUpperCase()+' '+P[k].name.slice(3),{v:k},k===VAR)).join('')
    +`<span class="sep"></span>`+link('Glow: animate',{glow:''},GLOWMODE==='anim')+link('Glow: peak',{glow:'peak'},GLOWMODE==='peak')+link('Glow off',{glow:null},GLOWMODE==='off')
    +`<span class="sep"></span><label>Strength <input type="range" id="k" min="0.5" max="2.5" step="0.1" value="${K}"><span class="stat" id="kv">${K.toFixed(1)}x</span></label>`
    +`<span class="sep"></span><span class="stat" id="geom"></span><span class="stat">glow now <b id="glowval">-</b></span>`
    +`<span class="stat" id="cr" style="flex-basis:100%"></span>`;
  const sec=(t,sub)=>{ const d=document.createElement('div'); d.innerHTML=`<div class="sec-t">${t}</div>${sub?`<div class="note">${sub}</div>`:''}`; page.appendChild(d); };
  const cap=(el,txt)=>{ const d=document.createElement('div'); d.innerHTML=`<div class="cap">${txt}</div>`; d.appendChild(el); page.appendChild(d); };
  sec(`Variant ${VAR.toUpperCase()}: ${P[VAR].name.slice(3)}`, `${W}px wide. Glow preview: add ?glow (pulse) or ?glow=peak. DPR now ${window.devicePixelRatio}.`);
  for(const k of ['welcome','club','squad','reports']){ const h=makeHero(VAR,k,W); cap(h.el,`<b>${k}</b> page image`); }
  sec('Side by side on the welcome image','Current pitch grid first (reference), then A, B, C, D. Same glow controls apply.');
  for(const k of ['g','a','b','c','d']){ const h=makeHero(k,'welcome',W); cap(h.el,`<b>${P[k].name}</b>`); }
  const gm=heroes[0].g; document.getElementById('geom').innerHTML=`${P[VAR].name.slice(3)}: <b>${gm.segs.length}</b> strands, <b>${gm.knots.length}</b> knots at ${W}x${H}`;
  document.getElementById('k').addEventListener('input',e=>{ K=parseFloat(e.target.value); document.getElementById('kv').textContent=K.toFixed(1)+'x'; heroes.forEach(h=>h.paint()); });
  (async()=>{ try{ await document.fonts.ready; const r=await contrast(heroes[1]); // club image = brightest of the lot
    document.getElementById('cr').innerHTML=`Worst-pixel (p99) contrast on the <b>club</b> header: title <b>${r.before[0].toFixed(1)}</b> -> <b>${r.after[0].toFixed(1)}</b>:1, subtitle <b>${r.before[1].toFixed(1)}</b> -> <b>${r.after[1].toFixed(1)}</b>:1 (without -> with net; WCAG large text needs 3, normal 4.5)`; }catch(e){ document.getElementById('cr').textContent='contrast readout failed: '+e; } })();
}
startGlow();
</script>
