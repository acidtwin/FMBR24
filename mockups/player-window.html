<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player window</title>
<!--
=====================================================================================================================
PLAYER WINDOW - MASTER MOCKUP (gui/player_window.py, PlayerWindow).  Always edit THIS file when we need a visual.
Supersedes player-window-options.html (kept as history: options A/B/C) and positions-tab-options.html (deleted).
=====================================================================================================================

HOW TO USE
  Click the left tab strip to switch tabs. Deep links: #profile #contract #transfer #positions #general #positional #role #history
  State flags after '+':   pot (Profile: "At potential")   future (Positions: "Future")   gk (goalkeeper sample)
    low (low-rated 19yo sample)   scout (opened from Scouting: Make HGP/HGC disabled)   short (already on shortlist)
    inj (injured)   hgp / hgc (homegrown set)   data (show sample wage/value/height/weight instead of PENDING)
    tips (pin the tooltips so they show in a screenshot)
  e.g.  #profile+pot   #positions+gk   #positions+low   #profile+scout   #positions+future   #contract+data+hgp
  The review bar above the window (sample / state toggles) is NOT part of the window.

WHERE TO EDIT (every tab is ONE function in section 4; its header slot sits right beside it)
  tabProfile  tabContract  tabTransfer  tabPositions  tabGeneral  tabPositional  tabRole  tabHistory  -> registry TABS (section 4)
  Persistent parts (section 3): header(), tabStrip(), actionStrip().   Data (section 1) is FICTIONAL sample data.

TOKENS (gui/theme.py COLORS, literal)
  window_bg #14151A  surface #1A2226  elevated #292B32  border #343740  border_bright #454A58
  text #FFFFFF  text_secondary #8B96A8  text_dim #525B68 (disabled only, fails AA)
  accent #6933BD  accent_hover #735CE4  accent_press #641EAA  selection_bg #2A1B4A
  hgp_green (actually blue) #5AA0D1
  player_window.py literals: C_POT #9A8AF5 (potential purple)  C_ALT #1E292E (zebra)
  TIER_HEX  t1 1-4 #E8696A | t2 5-8 #E0973C | t3 9-11 #8B96A8 | t4 12-13 #E6EAF0 | t5 14-16 #EAD95C (light yellow) | t6 17-20 #52C287 (green = best, as in FM)
  TILE_ALPHA 36 (0.14): tile fill = tier colour at rgba(...,0.14).  Injured chip #8B1A1A.  Dot ink on solid fill #14151A.
  POSITION BADGES (_POS_BADGE_COLORS): GK #C07B2A, D*/SW/WB* #3A6BA8, DM #5A3A8A, M*/AM* #3A8A5A, ST #A83A3A; white text, radius 2.
  PITCH: grass stripes #15301F / #1D4229 (12 equal horizontal bands), lines rgba(255,255,255,0.42) 1px, natural ring #FFFFFF 2px,
         labels rgba(255,255,255,0.72).  Custom paintEvent in PyQt6 (fillRect stripes, drawLine/drawRect/drawArc, drawEllipse, drawText).

METRICS (px)
  Window client 1100x760 (min 1040x640).  OS title bar is the real one (no custom topbar).
  Vertical: 12 pad | header 80 | 12 | main 592 (tab strip + content) | 12 | action strip 52.   Horizontal: 12 | tab strip 150 | 12 | content 912 | 12.
  Panel QFrame#pwPanel: bg surface, 1px border, radius 3.  Panel header 36, pad 0 12, 11/700 UPPERCASE text_secondary (QFont letter-spacing).
  Header panel 80: pad 0 16, avatar 48, name 20/700, row2 12 secondary, row3 chips h20 (pills r10), CA/PA boxes 104x52 (label, 20/700 value,
    6px bar), tab slot 172 wide behind a 1px border divider (label 10/700 caps, value 20/700, sub 11 secondary).
  Tab strip QFrame panel 150: rows 34, inset 6; selected = selection_bg + 3px accent left border + white 700; hover = elevated.
  Rows: attribute/kv 24-26 tall.  Bars 6px square-ended (track #343740).  Buttons h32 r3.  Segmented control h24 (Current | At potential).
  Action strip QFrame#actionStrip h52 bg surface, border-top 1px only.  Fonts: Noto Sans fallback; 10/11/12, headings 20, numerals 20-36.

QSS / PyQt6 RULES: no blur, box-shadow, opacity, transition, grid, ::after. Hover and tooltip bubbles here are review aids only
  (real app: QToolTip / :hover pseudo-states).  Radius <= half height.  Letter-spacing through QFont.

HEADER TAB SLOT (right end, the core header never moves; the slot is the only part that changes per tab)
  Profile: Dev Rate N | Contract: "Until Jun 2031" + club | Transfer: value range (PENDING) | Positions: best position + rating
  (switches to "Best at potential" in Future) | History: Apps / Goals (PENDING) | General / Positional / Role: Dev Rate (default).

OPEN QUESTIONS
  1. Natural ring: drawn on EVERY rating of 20 (as in the old mock); the listed/primary position is bold in the list. Alternative:
     ring only the listed position's dot. Which?
  2. Rating words: "Ineffective" for 1 only and "Awkward" for 2-4 is the agent's recollection, UNVERIFIED (earlier mock had Awkward 1-4).
  3. Foot words (Very Weak ... Very Strong) are assumed.
  4. Positions "Future": DESIGN ONLY. A real implementation needs a position-rating recompute from the projected attributes
     (fm_editor/potential.project_attrs -> the same position-weights that produce the 15 current ratings).
  5. Tab strip style follows the current implementation (selection_bg + accent left edge), not the accent-fill of the earlier mock.
=====================================================================================================================
-->
<style>
:root{
  --bg:#14151A; --surface:#1A2226; --elev:#292B32; --border:#343740; --border2:#454A58;
  --tx:#FFFFFF; --tx2:#8B96A8; --tx3:#525B68;
  --acc:#6933BD; --acc2:#735CE4; --accp:#641EAA; --sel:#2A1B4A;
  --hg:#5AA0D1; --pot:#9A8AF5; --alt:#1E292E;
  --c1:#E8696A; --c2:#E0973C; --c3:#8B96A8; --c4:#E6EAF0; --c5:#EAD95C; --c6:#52C287;
  --k1:rgba(232,105,106,0.14); --k2:rgba(224,151,60,0.14); --k3:rgba(139,150,168,0.14);
  --k4:rgba(230,234,240,0.14); --k5:rgba(234,217,92,0.14); --k6:rgba(82,194,135,0.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0E0F13;color:var(--tx);font:12px/1.3 "Noto Sans","Liberation Sans",Arial,sans-serif;padding:16px 24px 48px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button[disabled]{cursor:default}
svg{display:block}
svg text{font-family:"Noto Sans","Liberation Sans",Arial,sans-serif}

/* ---- review bar (NOT part of the window) ---- */
.rv{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 auto 12px;max-width:1120px}
.rv h1{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.rv .lab{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-right:-6px}
.rseg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.rseg button{height:28px;padding:0 12px;font-weight:700;color:var(--tx2);background:var(--surface)}
.rseg button.on{background:var(--acc);color:#fff}
.tg{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:3px;background:var(--surface);color:var(--tx2);font-weight:600}
.tg.on{border-color:var(--acc2);color:#fff;background:var(--sel)}
.cap{max-width:1120px;margin:10px auto 0;color:var(--tx3);font-size:11px}
.viewport{max-width:1120px;margin:0 auto;overflow:auto}

/* ---- OS window frame ---- */
.frame{width:1100px;border:1px solid var(--border);background:var(--bg);margin:0 auto}
.os{height:30px;background:#101116;display:flex;align-items:center;padding:0 12px;color:var(--tx2);font-size:12px;border-bottom:1px solid var(--border)}
.os span:first-child{flex:1;text-align:center;padding-left:54px}
.os i{display:inline-block;width:10px;height:10px;border:1px solid var(--tx3);margin-left:8px}
.win{height:760px;display:flex;flex-direction:column;background:var(--bg);position:relative}
.body{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
.main{flex:1;min-height:0;display:flex;gap:12px}
.content{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;overflow-y:auto;overflow-x:hidden}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:var(--surface)}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ---- shared atoms ---- */
.pn{background:var(--surface);border:1px solid var(--border);border-radius:3px;min-width:0}
.ph{height:36px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.ph .r{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-weight:400}
.pnote{font-size:11px;font-weight:400;color:var(--tx2)}
.kv{height:24px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv .l{color:var(--tx2)} .kv .r{color:#fff;font-weight:600;text-align:right;white-space:nowrap}
.kv:nth-child(even){background:var(--alt)}
.pend{display:inline-block;height:16px;line-height:16px;padding:0 6px;border-radius:2px;background:var(--elev);color:var(--tx2);font-size:10px;font-weight:700;letter-spacing:.06em;vertical-align:middle}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}.c6{color:var(--c6)}
.f1{background:var(--c1)}.f2{background:var(--c2)}.f3{background:var(--c3)}.f4{background:var(--c4)}.f5{background:var(--c5)}.f6{background:var(--c6)}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}.k5{background:var(--k5)}.k6{background:var(--k6)}
.badge{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:28px;padding:0 5px;border-radius:2px;font-size:10px;font-weight:700;color:#fff;flex:none}
.badge.w{min-width:44px}
.bGK{background:#C07B2A}.bD{background:#3A6BA8}.bDM{background:#5A3A8A}.bM{background:#3A8A5A}.bST{background:#A83A3A}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:10px;font-size:10px;font-weight:700;border:1px solid var(--border2);color:var(--tx2)}
.pill.on{color:var(--hg);border-color:var(--hg);background:rgba(90,160,209,0.14)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:3px;font-size:11px;font-weight:600;background:var(--elev);color:#fff;white-space:nowrap}
.chip.inj{background:#8B1A1A}
.chip.ok{color:#52C287}
.chip.pers{background:var(--sel);color:var(--pot)}
.chip.soon{height:20px;border-radius:10px;padding:0 10px;font-size:10px;font-weight:700;letter-spacing:.08em;background:transparent;border:1px solid var(--border2);color:var(--tx2)}
.bar{height:6px;background:var(--border);position:relative;min-width:0;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.tile{height:20px;min-width:30px;padding:0 6px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.btn{height:32px;padding:0 16px;border-radius:3px;font-weight:700;font-size:12px;border:1px solid transparent;white-space:nowrap}
.b1{background:var(--acc);color:#fff}.b1:hover{background:var(--acc2)}
.b2{background:var(--surface);border-color:var(--border2);color:#fff}.b2:hover{background:var(--elev)}
.b2.on{border-color:var(--acc2);color:var(--pot);background:var(--sel)}
.b2[disabled],.b2[disabled]:hover{color:var(--tx3);border-color:var(--border);background:var(--elev)}
/* segmented control (Current | At potential, Current | Future) */
.sg{display:inline-flex;border:1px solid var(--border2);border-radius:3px;overflow:hidden;background:var(--bg)}
.sg button{white-space:nowrap;height:22px;padding:0 12px;font-size:11px;font-weight:700;color:var(--tx2);background:var(--bg)}
.sg button.on{background:var(--acc);color:#fff}
/* review-only tooltip bubble (real app: QToolTip) */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--elev);border:1px solid var(--border2);border-radius:3px;padding:4px 8px;font-size:11px;font-weight:400;color:#fff;z-index:20;pointer-events:none}
[data-tip]:hover::after,[data-tip].pin::after{display:block}
.trow[data-tip]::after{bottom:auto;top:calc(100% + 4px);left:auto;right:12px;transform:none}

/* ---- persistent header ---- */
.hdr{height:80px;padding:0 16px;display:flex;align-items:center;gap:14px;flex:none}
.avatar{width:48px;height:48px;background:var(--elev);border-radius:3px;display:flex;align-items:center;justify-content:center;flex:none}
.avatar svg{width:30px;height:30px}
.hid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hid .r1{display:flex;align-items:center;gap:10px;height:24px}
.hid .nm{font-size:20px;font-weight:700;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hid .r2{color:var(--tx2);font-size:12px;height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hid .r3{display:flex;align-items:center;gap:6px;height:20px}
.hid .r3 .hw{margin-left:8px;color:var(--tx2);font-size:11px;display:flex;align-items:center;gap:6px}
.cab{width:104px;height:52px;padding:6px 10px 0;background:var(--bg);border:1px solid var(--border);border-radius:3px;flex:none}
.cab .t{display:flex;align-items:baseline;justify-content:space-between;height:26px}
.cab small{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx2)}
.cab b{font-size:20px;line-height:1.1}
.cab .bar{display:block;flex:none;margin-top:3px}
.slot{width:172px;flex:none;height:56px;border-left:1px solid var(--border);padding-left:16px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.slot small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);white-space:nowrap}
.slot .v{font-size:20px;font-weight:700;line-height:24px;height:24px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.slot .s{font-size:11px;color:var(--tx2);height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- persistent tab strip ---- */
.tabs{width:150px;flex:none;padding:6px;display:flex;flex-direction:column;gap:2px}
.tab{height:34px;padding:0 10px 0 9px;display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--tx2);text-align:left;border-left:3px solid transparent;border-radius:0}
.tab:hover{background:var(--elev);color:#fff;border-left-color:var(--border2)}
.tab.on,.tab.on:hover{background:var(--sel);color:#fff;font-weight:700;border-left-color:var(--acc)}

/* ---- persistent action strip ---- */
.strip{height:52px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none}
.strip .sp{flex:1}

/* ---- PROFILE ---- */
.p-attr{flex:1;min-width:0}
.p-cols{display:flex;gap:8px;padding:0 4px 10px}
.p-cols>.col{flex:1;min-width:0}
.ch{height:24px;padding:0 4px;display:flex;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.tr2{height:26px;padding:0 4px;display:flex;align-items:center;gap:6px}
.tr2 .an{flex:1;min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-rail{width:216px;flex:none;display:flex;flex-direction:column;gap:12px}
.prs{display:flex;align-items:center;gap:8px;height:26px;padding:0 12px}
.prs .an{width:96px;color:var(--tx2);flex:none} .prs b{width:22px;text-align:right}
.trow{padding:4px 12px;min-height:26px;display:flex;align-items:center;font-weight:600}
.trow:nth-child(even){background:var(--alt)}
.trow.mute{color:var(--tx2);font-weight:400}
.cp{padding:0 12px 10px;color:var(--tx2);font-size:11px;line-height:1.5}

/* ---- CONTRACT / COMING SOON ---- */
.c-col{width:360px;flex:none;display:flex;flex-direction:column;gap:12px}
.note{padding:0 12px 14px;color:var(--tx2);font-size:12px;line-height:1.5}
.soonpg{flex:1;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.soonpg .t{font-size:20px;font-weight:700}
.soonpg .d{width:360px;color:var(--tx2);font-size:12px;line-height:1.5}

/* ---- POSITIONS ---- */
.o1list{width:456px;flex:none;align-self:stretch;display:flex;flex-direction:column}
.pr{height:26px;padding:0 12px;display:flex;align-items:center;gap:8px;flex:none}
.pr:nth-child(even){background:var(--alt)}
.pr.nat,.pr.nat:nth-child(even){background:var(--sel)}
.pr .nm{flex:1;min-width:0;color:#fff;white-space:nowrap}
.pr.me .nm{font-weight:700}
.pr .lb{flex:1;color:#fff}
.pr .wd{width:112px;color:var(--tx2);flex:none;white-space:nowrap}
.pr.nat .wd{color:#fff;font-weight:700}
.pr .wd i{font-style:normal;font-weight:700;color:var(--pot);margin-left:4px}
.pr.hl,.pr.hl:nth-child(even){background:var(--elev)}
.sub{height:30px;margin-top:4px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);flex:none}
.sub em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0}
.key{margin-top:auto;padding:6px 12px 12px;color:var(--tx2);font-size:11px;line-height:1.5}
.lg{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px}
.o1pitch{width:444px;flex:none;align-self:stretch;overflow:hidden}
</style>
</head>

function pitchSVG(R,W,H,M){
  const g={boxW:238,boxD:88,sixW:108,sixD:29,circR:54,spotD:58,goalW:43,goalD:6};
  const LN='rgba(255,255,255,0.42)',x0=M,y0=M,w=W-2*M,h=H-2*M,cx=x0+w/2,cy=y0+h/2,y1=y0+h;
  const n=12,bh=H/n;let s=`<rect x="0" y="0" width="${W}" height="${H}" fill="#15301F"/>`;
  for(let i=1;i<n;i+=2)s+=`<rect x="0" y="${(i*bh).toFixed(1)}" width="${W}" height="${bh.toFixed(1)}" fill="#1D4229"/>`;
  const st=`fill="none" stroke="${LN}" stroke-width="1"`;
  s+=`<rect x="${x0+.5}" y="${y0+.5}" width="${w}" height="${h}" ${st}/><line x1="${x0}" y1="${cy}" x2="${x0+w}" y2="${cy}" stroke="${LN}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${g.circR}" ${st}/><circle cx="${cx}" cy="${cy}" r="2" fill="${LN}"/>`;
  [0,1].forEach(bot=>{
    const bx=cx-g.boxW/2,sx=cx-g.sixW/2,gx=cx-g.goalW/2,by=bot?y1-g.boxD:y0,sy=bot?y1-g.sixD:y0,gy=bot?y1:y0-g.goalD;
    s+=`<rect x="${bx}" y="${by+.5}" width="${g.boxW}" height="${g.boxD}" ${st}/><rect x="${sx}" y="${sy+.5}" width="${g.sixW}" height="${g.sixD}" ${st}/><rect x="${gx}" y="${gy+.5}" width="${g.goalW}" height="${g.goalD}" ${st}/>`;
    const spotY=bot?y1-g.spotD:y0+g.spotD,edgeY=bot?y1-g.boxD:y0+g.boxD,dy=Math.abs(g.boxD-g.spotD),dx=Math.sqrt(g.circR**2-dy**2);
    s+=`<circle cx="${cx}" cy="${spotY}" r="2" fill="${LN}"/><path d="M${cx-dx},${edgeY} A${g.circR} ${g.circR} 0 0 ${bot?1:0} ${cx+dx},${edgeY}" ${st}/>`;
  });
  // dots: lowest first so the best sit on top. d28 solid tier fill, number 12/700 ink; 1-4 = ghost; 20 = white ring r18
  s+=POS.slice().sort((a,b)=>R[a]-R[b]).map(p=>{
    const x=M+SLOTS[p][0]*w,y=M+SLOTS[p][1]*h,v=R[p],t=tier(v),c=HEX[t],ghost=t===1;
    return `<g class="dg" data-p="${p}">`+(v>=20?`<circle cx="${x}" cy="${y}" r="18" fill="none" stroke="#FFFFFF" stroke-width="2"/>`:'')
      +(ghost?`<circle cx="${x}" cy="${y}" r="13.5" fill="rgba(20,21,26,0.55)" stroke="${c}" stroke-width="1"/>`:`<circle cx="${x}" cy="${y}" r="14" fill="${c}"/>`)
      +`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="${ghost?c:'#14151A'}">${v}</text>`
      +`<text x="${x}" y="${y-22}" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,0.72)">${CODE[p]}</text></g>`}).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

  const h=location.hash.replace('#','').split('+');
  if(TABS.some(t=>t.key===h[0]))S.tab=h[0];
  FLAGS.forEach(f=>S[f]=false);S.smp='out';
  h.slice(1).forEach(f=>{if(FLAGS.includes(f))S[f]=true;if(f==='gk'||f==='low')S.smp=f});
  render();
}
window.addEventListener('hashchange',()=>{const cur=location.hash;fromHash()});
fromHash();
</script>
