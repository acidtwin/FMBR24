<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player window - three options</title>
<!--
PLAYER DETAIL WINDOW (PlayerDetailDialog) - DESIGN OPTIONS A / B / C
Deep links: #a  #b  #c  #c-attributes  #c-positions  #c-contract   plus flags joined with + :
  pot (potential on)  short (shortlisted)  inj (injured)  gk (goalkeeper sample)  pend (unparsed fields as PENDING)
  min (minimum size)  hgp / hgc / both (homegrown status)       e.g.  #b+pot+short

TOKENS (gui/theme.py COLORS, literal)
  window_bg #14151A  surface #1A2226  elevated #292B32  border #343740  border_bright #454A58
  text #FFFFFF  text_secondary #8B96A8  text_dim #525B68 (disabled only, fails AA)
  accent #6933BD  accent_hover #735CE4  accent_press #641EAA  selection_bg #2A1B4A
  hgp_green(actually blue) #5AA0D1  non_hgp_red #D14343  warning #FF501E
  NEW LITERALS proposed for COLORS:  pot #9A8AF5 (accent_hover lightened, 5.4:1 on surface; the potential half of "14 / 17")
    alt_row #1E292E (zebra)  hairline #252C30  red_text #E8696A (AA red text)  amber #E0973C  white2 #E6EAF0
  POSITION BADGES: existing _POS_BADGE_COLORS (GK #C07B2A, D* #3A6BA8, DM #5A3A8A, M/AM #3A8A5A, ST #A83A3A, INJ #8B1A1A), white text, radius 2

ATTRIBUTE VALUE SCALE (replaces _attr_val_color; monotonic, purple reserved for interaction/potential)
  1-4 #E8696A | 5-8 #E0973C | 9-11 #8B96A8 | 12-13 #E6EAF0 | 14-16 #52C287 | 17-20 #FFD700 (bold on all)
  Injury Prone, Dirtiness, Eccentricity are "lower is better": coloured on the inverted value (21-v).
  Tile fills (option B) = same hue at rgba(...,0.14).

METRICS (px, 4px grid)
  Window client default 1100x760 (today 920x640, min 860x560). Proposed minimum 1040x640. Drop the custom 40px topbar + x: the OS
  title bar already shows the name (it is duplicated today).
  Panel: QFrame#panel  bg #1A2226, 1px #343740, radius 3. Gap between panels 12, window padding 12. Panel header 36 tall, pad 0 12,
  11/700 UPPERCASE #8B96A8 (QFont letter-spacing 1px, .upper()). Row 24 tall, pad 0 8 (attribute rows), value cell fixed 50 wide, right aligned.
  Fonts: Noto Sans fallback only. Sizes 10 / 11 / 12 / 13, headings 16-24 bold, big numerals 32 bold. No condensed face assumed.
  Bars: 6px tall, SQUARE ended, track #343740 (QProgressBar + ::chunk, or fixed-width QFrames).  Pills h20 r10. Buttons h32 r3. Switch 30x16 (SVG indicator file).
  Action strip: QFrame#actionStrip h52 bg #1A2226, border-top 1px #343740 only (objectName-scoped).
  Only borders in the window: panel outline, action strip top edge, tab strip bottom edge (C). No divider lines inside panels (zebra rows instead).

QSS NOTES: no blur/shadows/grid/opacity/transition. Hover states are cosmetic here (not QSS pseudo-states shown). Letter-spacing via QFont.
-->
<style>
:root{
  --bg:#14151A; --surface:#1A2226; --elev:#292B32; --border:#343740; --border2:#454A58;
  --tx:#FFFFFF; --tx2:#8B96A8; --tx3:#525B68;
  --acc:#6933BD; --acc2:#735CE4; --accp:#641EAA; --sel:#2A1B4A;
  --hg:#5AA0D1; --red:#D14343; --warn:#FF501E;
  --pot:#9A8AF5; --alt:#1E292E; --hair:#252C30;
  --c1:#E8696A; --c2:#E0973C; --c3:#8B96A8; --c4:#E6EAF0; --c5:#52C287; --c6:#FFD700;
  --k1:rgba(232,105,106,0.14); --k2:rgba(224,151,60,0.14); --k3:rgba(139,150,168,0.14);
  --k4:rgba(230,234,240,0.14); --k5:rgba(82,194,135,0.14); --k6:rgba(255,215,0,0.14);
  --w:1100px; --h:760px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0E0F13;color:var(--tx);font:12px/1.3 "Noto Sans","Liberation Sans",Arial,sans-serif;padding:16px 24px 48px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---- review bar (not part of the window) ---- */
.rv{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 auto 12px;max-width:1120px}
.rv h1{font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.seg button{height:28px;padding:0 14px;font-weight:700;color:var(--tx2);background:var(--surface)}
.seg button.on{background:var(--acc);color:#fff}
.seg.xl button{height:34px;padding:0 22px;font-size:13px}
.tg{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:3px;background:var(--surface);color:var(--tx2);font-weight:600}
.tg.on{border-color:var(--acc2);color:#fff;background:var(--sel)}
.rv .lab{color:var(--tx3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-right:-10px}
.note{max-width:1120px;margin:0 auto 14px;color:var(--tx2);font-size:12px;line-height:1.5}
.note b{color:#fff}
.viewport{max-width:1120px;margin:0 auto;overflow:auto}

/* ---- OS window frame ---- */
.frame{width:var(--w);border:1px solid var(--border);background:var(--bg);margin:0 auto}
.os{height:30px;background:#101116;display:flex;align-items:center;padding:0 12px;color:var(--tx2);font-size:12px;border-bottom:1px solid var(--border)}
.os span:first-child{flex:1;text-align:center;padding-left:54px}
.os i{display:inline-block;width:10px;height:10px;border:1px solid var(--tx3);margin-left:8px}
.win{height:var(--h);display:flex;flex-direction:column;background:var(--bg)}
.scroll{overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-track{background:var(--surface)}
.scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ---- shared atoms ---- */
.pn{background:var(--surface);border:1px solid var(--border);border-radius:3px;min-width:0}
.ph{height:36px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.pb{padding:0 0 10px}
.kv{height:24px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kv .l{color:var(--tx2)} .kv .r{color:#fff;font-weight:600;text-align:right;white-space:nowrap}
.kv:nth-child(even){background:var(--alt)}
.pend{display:inline-block;height:16px;line-height:16px;padding:0 6px;border-radius:2px;background:var(--elev);color:var(--tx2);font-size:10px;font-weight:700;letter-spacing:.06em}
.c1{color:var(--c1)}.c2{color:var(--c2)}.c3{color:var(--c3)}.c4{color:var(--c4)}.c5{color:var(--c5)}.c6{color:var(--c6)}
.f1{background:var(--c1)}.f2{background:var(--c2)}.f3{background:var(--c3)}.f4{background:var(--c4)}.f5{background:var(--c5)}.f6{background:var(--c6)}
.k1{background:var(--k1)}.k2{background:var(--k2)}.k3{background:var(--k3)}.k4{background:var(--k4)}.k5{background:var(--k5)}.k6{background:var(--k6)}
.av b,.tile b{font-weight:700}
.sl{font-style:normal;color:var(--tx3);margin:0 3px;font-weight:400}
.pt{color:var(--pot)}
.badge{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:28px;padding:0 5px;border-radius:2px;font-size:10px;font-weight:700;color:#fff}
.bGK{background:#C07B2A}.bD{background:#3A6BA8}.bDM{background:#5A3A8A}.bM{background:#3A8A5A}.bST{background:#A83A3A}.bINJ{background:#8B1A1A}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:10px;font-size:10px;font-weight:700;border:1px solid var(--border2);color:var(--tx2)}
.pill.on{color:var(--hg);border-color:var(--hg);background:rgba(90,160,209,0.14)}
.pill.unk{border-color:transparent;padding:0 2px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:3px;font-size:11px;font-weight:600;background:var(--elev);color:#fff}
.chip.inj{background:#8B1A1A}
.chip.pers{background:var(--sel);color:var(--pot)}
.chip.ok{color:var(--c5)}
.avatar{width:40px;height:40px;background:var(--elev);border-radius:3px;display:flex;align-items:center;justify-content:center;flex:none}
.avatar svg{width:26px;height:26px}
.bar{height:6px;background:var(--border);flex:1;position:relative;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.btn{height:32px;padding:0 16px;border-radius:3px;font-weight:700;font-size:12px;border:1px solid transparent;white-space:nowrap}
.b1{background:var(--acc);color:#fff}.b1:hover{background:var(--acc2)}
.b2{background:var(--surface);border-color:var(--border2);color:#fff}.b2:hover{background:var(--elev)}
.b2.q{border-color:var(--hg);color:var(--hg);background:rgba(90,160,209,0.14)}
.b2.on{border-color:var(--acc2);color:var(--pot);background:var(--sel)}
.b2[disabled]{color:var(--tx3);border-color:var(--border);cursor:default;background:var(--elev)}
.strip{height:52px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none}
.strip .hint{flex:1;color:var(--tx2);font-size:11px}
/* potential switch */
.sw{display:inline-flex;align-items:center;gap:8px;color:var(--tx2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.sw .tr{width:30px;height:16px;border-radius:8px;background:var(--border);position:relative;flex:none}
.sw .tr::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:6px;background:var(--tx2)}
.sw.on{color:#fff}.sw.on .tr{background:var(--acc2)}.sw.on .tr::after{left:16px;background:#fff}
.pnote{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx2);margin-right:4px}
.sw small{font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx3)}
/* segmented current|potential (B) */
.sg{display:inline-flex;border:1px solid var(--border2);border-radius:3px;overflow:hidden}
.sg button{white-space:nowrap;height:24px;padding:0 12px;font-size:11px;font-weight:700;color:var(--tx2);background:var(--bg)}
.sg button.on{background:var(--acc);color:#fff}
.sg button.on.p{background:var(--acc)}
/* legend */
.lg{white-space:nowrap;display:flex;align-items:center;gap:12px;color:var(--tx2);font-size:11px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px}

/* ---- attribute rows ---- */
.ar{height:24px;padding:0 6px;display:flex;align-items:center;gap:4px}
.ar:nth-child(even){background:var(--alt)}
.ar .an{flex:1;min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .av{width:46px;text-align:right;flex:none;font-size:12px}
.ch{height:24px;padding:0 8px;display:flex;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.cols{display:flex;gap:12px;padding:0 6px 10px}
.cols>.col{flex:1;min-width:0}

/* =============== OPTION A =============== */
.a-body{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.a-left{width:224px;flex:none;display:flex;flex-direction:column;gap:12px}
.a-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.a-right{width:240px;flex:none;display:flex;flex-direction:column;gap:12px}
.a-id{display:flex;align-items:center;gap:12px;padding:12px}
.a-id .nm{font-size:16px;font-weight:700;line-height:1.2}
.a-id .sb{color:var(--tx2);font-size:11px;margin-top:2px}
.ab{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px}
.ab .l{width:24px;color:var(--tx2)} .ab .v{width:32px;text-align:right;font-weight:700;font-size:13px}
.prow{display:flex;gap:6px;align-items:center}
.pgrid{display:flex;flex-direction:column;gap:2px;padding:0 12px 4px}
.pgrid .row{display:flex;gap:8px}
.pgrid .cell{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:28px}
.pgrid .cell b{font-size:12px}

/* =============== OPTION B =============== */
.b-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px}
.hero{display:flex;gap:24px;padding:16px;height:200px;align-items:stretch;flex:none}
.hero .id{flex:1;min-width:0;display:flex;gap:14px}
.hero .id .avatar{width:64px;height:64px}
.hero .id .avatar svg{width:40px;height:40px}
.hero .nm{font-size:24px;font-weight:700;line-height:1.15}
.hero .sb{color:var(--tx2);font-size:12px;margin-top:4px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.big{display:flex;gap:20px;flex:none;width:208px}
.big .n{flex:1}
.big .lab{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase}
.big .num{font-size:36px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.pitchwrap{display:flex;gap:12px;flex:none}
.pitch{width:112px;height:168px;position:relative;border:1px solid var(--border2);background:var(--bg);border-radius:3px}
.pitch .ln{position:absolute;border:1px solid var(--border)}
.pitch .dot{position:absolute;width:20px;height:20px;border-radius:10px;margin:-10px 0 0 -10px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid}
.toppos{width:120px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.toppos .r{display:flex;align-items:center;gap:8px;height:24px}
.toppos .r b{font-size:13px;margin-left:auto}
.acts{width:196px;flex:none;display:flex;flex-direction:column;gap:8px;justify-content:center}
.acts .two{display:flex;gap:8px}.acts .two .btn{flex:1;padding:0}
.acts .btn.w{width:100%}
.b-main{flex:none;display:flex;gap:12px;align-items:stretch}
.b-attr{flex:1;min-width:0;display:flex;flex-direction:column}
.b-rail{width:252px;flex:none;display:flex;flex-direction:column;gap:12px}
.tr2{height:26px;padding:0 6px;display:flex;align-items:center;gap:8px}
.tr2 .an{flex:1;min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{height:20px;min-width:30px;padding:0 6px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.prs{display:flex;align-items:center;gap:8px;height:26px;padding:0 12px}
.prs .an{width:96px;color:var(--tx2)} .prs b{width:22px;text-align:right}

/* =============== OPTION C =============== */
.c-sum{display:flex;align-items:center;gap:14px;padding:0 16px;height:72px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.c-sum .nm{font-size:18px;font-weight:700;line-height:1.2}
.c-sum .sb{color:var(--tx2);font-size:12px;margin-top:2px}
.c-sum .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.cab{display:flex;flex-direction:column;align-items:flex-start;padding:0 10px;height:44px;justify-content:center;background:var(--bg);border:1px solid var(--border);border-radius:3px}
.cab small{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase}
.cab b{font-size:18px;line-height:1.1}
.tabs{display:flex;align-items:flex-end;height:40px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--border);flex:none}
.tabs .t{height:40px;padding:0 16px;font-size:12px;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .t.on{color:#fff;border-bottom-color:var(--acc2)}
.tabs .sp{flex:1}
.tabs .sw{align-self:center}.tabs .pnote{align-self:center;margin-right:12px}
.c-body{flex:1;min-height:0;padding:12px;display:flex;gap:12px;align-items:flex-start}
.c-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.cr{height:26px;padding:0 12px;display:flex;align-items:center;gap:10px}
.cr:nth-child(even){background:var(--alt)}
.cr .an{flex:1;min-width:0;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .bars{width:80px;height:6px;background:var(--border);display:flex;flex:none}
.cr .bars i{display:block;height:6px}
.cr .av{width:50px;text-align:right;flex:none}
.cr .gr{width:96px;color:var(--tx2);font-size:11px;flex:none}
.empty{padding:14px 12px 16px;color:var(--tx2);font-size:12px;line-height:1.5}
.empty .pend{margin-bottom:8px;display:block;width:max-content}
.hgt{padding:8px 12px 14px;color:var(--tx2);font-size:11px;line-height:1.5}

.cap{max-width:1120px;margin:10px auto 0;color:var(--tx3);font-size:11px}
</style>
</head>
<body>

<div class="rv">
  <h1>Player window</h1>
  <div class="seg xl" id="optSeg"></div>
  <span class="lab">state</span>
  <div id="tgs" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <span class="lab">homegrown</span>
  <div class="seg" id="hgSeg"></div>
  <span class="lab">size</span>
  <div class="seg" id="szSeg"></div>
</div>
<p class="note" id="note"></p>
<div class="viewport" id="vp"><div class="frame" id="frame"></div></div>

const OPTS={
 a:['A · Refined profile','The current left / centre / right structure, cleaned: flat panels, one border treatment, zebra rows instead of hairlines, six-tier value colours, position grid and GK column added. Suits: people who like FM Scout / the in-game profile and want zero relearning.'],
 b:['B · Hero + dense grid','Identity and the numbers that matter (CA / PA, position pitch, actions) live in a hero strip; every attribute sits in one dense tiled grid below, with a rail for contract and personality. Suits: fast scouting, "is he good and where does he play" in one glance.'],
 c:['C · Summary + tabs','A persistent summary header with Overview / Attributes / Positions / Contract & history tabs. Suits: progressive disclosure and room for history later; costs a click to see the full attribute set.']};
function render(){
  const st={};document.querySelectorAll('.scroll').forEach((e,i)=>st[i]=e.scrollTop);
  const d=P();
  document.getElementById('frame').innerHTML=`<div class="os"><span>${d.name}</span><i></i><i></i><i></i></div><div class="win">${({a:optA,b:optB,c:optC})[S.opt]()}</div>`;
  document.documentElement.style.setProperty('--w',S.min?'1040px':'1100px');
  document.documentElement.style.setProperty('--h',S.min?'640px':'760px');
  document.querySelectorAll('.scroll').forEach((e,i)=>e.scrollTop=st[i]||0);
  seg('optSeg',[['a','A'],['b','B'],['c','C']],S.opt,v=>{S.opt=v;render()});
  seg('hgSeg',[['none','None'],['hgp','HGP'],['hgc','HGC'],['both','Both']],S.hg,v=>{S.hg=v;render()});
  seg('szSeg',[['def','1100 × 760'],['min','1040 × 640 min']],S.min?'min':'def',v=>{S.min=v==='min';render()});
  const tg=document.getElementById('tgs');tg.innerHTML='';
  [['pot','Potential'],['short','Shortlisted'],['inj','Injured'],['gk','Goalkeeper'],['pend','Unparsed = PENDING']].forEach(([k,l])=>{
    const b=document.createElement('button');b.className='tg'+(S[k]?' on':'');b.textContent=l;b.onclick=()=>{S[k]=!S[k];render()};tg.appendChild(b)});
  document.getElementById('note').innerHTML=`<b>${OPTS[S.opt][0]}.</b> ${OPTS[S.opt][1]}`;
  location.hash=S.opt+(S.opt==='c'&&S.tab!=='overview'?'-'+S.tab:'');
  document.title='Player window - option '+S.opt.toUpperCase();
}
function seg(id,items,cur,fn){const e=document.getElementById(id);e.innerHTML='';items.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;if(v===cur)b.className='on';b.onclick=()=>fn(v);e.appendChild(b)})}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;return render()}
  const a=t.dataset.act;
  if(a==='pot')S.pot=!S.pot;else if(a==='poton')S.pot=true;else if(a==='potoff')S.pot=false;
  else if(a==='short')S.short=!S.short;else if(a==='qhgp')S.qhgp=!S.qhgp;else if(a==='qhgc')S.qhgc=!S.qhgc;else return;
  render();
});
